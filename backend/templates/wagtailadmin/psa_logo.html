{% load static %}{% comment %}
Логотип PSA в админке (static/img/). Какой вариант виден — решает static/psa-admin.css:
светлая тема — оригинальный (чёрные буквы), тёмная — со светлыми буквами,
в свёрнутом боковом меню — только узор.
{% endcomment %}
<span class="psa-admin-logo">
  <img class="psa-admin-logo__full" src="{% static 'img/psa-logo.png' %}" alt="PSA" width="158" height="40">
  <img class="psa-admin-logo__light" src="{% static 'img/psa-logo-white.png' %}" alt="PSA" width="158" height="40">
  <img class="psa-admin-logo__mark" src="{% static 'img/psa-mark.png' %}" alt="PSA" width="50" height="40">
</span>
